<!DOCTYPE html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f3ee" />
    <title>Page not found | chibi muere</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Runs before first paint so nothing flashes: theme, motion setting, and the matching favicon.
      (function () {
        var root = document.documentElement;
        var theme = null;
        var motion = null;
        try {
          theme = localStorage.getItem("chibi-theme");
          motion = localStorage.getItem("chibi-motion");
        } catch (e) {}
        theme = { light: "day", dark: "night" }[theme] || theme;
        if (theme !== "day" && theme !== "night") {
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        }
        root.dataset.theme = theme;
        if (motion === "on" || motion === "off") root.dataset.motion = motion;
        if (theme === "night") {
          document.querySelector('meta[name="theme-color"]').content = "#07060a";
          var icon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
          icon.href = icon.href.replace("favicon.svg", "favicon-night.svg");
          // Night headings use Pirata One: fetch it early so the title doesn't shift when it arrives.
          var font = document.createElement("link");
          font.rel = "preload";
          font.as = "font";
          font.type = "font/woff2";
          font.crossOrigin = "";
          font.href = icon.href.replace("favicon-night.svg", "fonts/pirata-one-latin-400.woff2");
          document.head.appendChild(font);
        }
      })();
    </script>

    <!-- Self-hosted fonts (public/fonts). Preload the two every page uses; Pirata One only loads at night. -->
    <link rel="preload" href="/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- CSS-only atmosphere: no scripts load on this page -->
    <div class="fx-layers" aria-hidden="true">
      <div class="light">
        <div class="haze haze-1"></div>
        <div class="haze haze-2"></div>
        <div class="haze haze-3"></div>
        <div class="beam"></div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
      <div class="scanlines"></div>
    </div>
    <main class="error-page" aria-labelledby="error-title">
      <p class="eyebrow">404</p>
      <h1 id="error-title">This page wandered off.</h1>
      <p class="lede">
        The address may be out of date, or the page may never have existed.
      </p>
      <a class="button" href="%BASE_URL%"
        >Back to chibi muere <span aria-hidden="true">&#8594;</span></a
      >
    </main>
  </body>
</html>
